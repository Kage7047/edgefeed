[project]
name = "edgefeed"
version = "0.2.0"
description = "Cross-venue prediction-market edge detection (Kalshi / Polymarket), net of real fees, depth and capital lock-up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "psycopg[binary]>=3.2",
]

[project.scripts]
edgefeed = "edgefeed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefeed"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/edgefeed"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real venue APIs (deselected by default)", "pg: needs Postgres"]
addopts = "-m 'not live'"
