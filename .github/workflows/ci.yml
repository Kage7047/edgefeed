name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edgefeed
          POSTGRES_PASSWORD: edgefeed
          POSTGRES_DB: edgefeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edgefeed" --health-interval 5s --health-retries 20
    env:
      EDGEFEED_TEST_PG_URL: postgresql+psycopg://edgefeed:edgefeed@localhost:5432/edgefeed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[dev]"
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: pytest (unit + Postgres)
        run: pytest -q --cov=edgefeed --cov-report=term --cov-report=xml
      - name: the Postgres tests must have run, not skipped
        run: pytest -q -m pg -rs | tee pg.txt && ! grep -q SKIPPED pg.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: committed bundle matches the source
        run: git status --porcelain ../src/edgefeed/static | tee /dev/stderr | (! grep .)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edgefeed:ci .
      - name: container serves the API and dashboard
        run: |
          docker run -d --name ef -p 8090:8090 -e EDGEFEED_DB_URL=sqlite:////tmp/ef.sqlite edgefeed:ci
          for i in $(seq 30); do curl -fs localhost:8090/api/scans && break; sleep 1; done
          curl -fs localhost:8090/ | grep -q '<div id="root">'
          curl -fs localhost:8090/api/report | grep -q verdict
          docker rm -f ef

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
